# Builds the Termite AppImage on Ubuntu 22.04, so it runs on glibc 2.35
# and newer; tests it first. Tags v* get a release.
name: Termite AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build
        env:
          TERMITE_BUILD_HERE: "1"
        run: packaging/build-appimage.sh dist

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          app=$(ls dist/*.AppImage)
          "$app" --version
          "$app" info
          TERMITE_SELFTEST=3 xvfb-run -a "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: Termite-AppImage
          path: dist/*.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.AppImage --title "Termite ${GITHUB_REF_NAME#v}" --generate-notes
