# Builds the Termite AppImage on Ubuntu 22.04, so it runs on glibc 2.35
# and newer; tests it first. A v* tag gets a release, and so does running
# it by hand (Actions > Termite AppImage > Run workflow) with "release"
# ticked: that tags the commit v<__version__ in termite/__init__.py.
name: Termite AppImage

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a release, tagged v<version from termite/__init__.py>
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Test
        run: python3 -m unittest discover -s tests -v

      - name: Build
        env:
          TERMITE_BUILD_HERE: "1"
        run: packaging/build-appimage.sh dist

      - name: Smoke test
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get install -y -qq xvfb >/dev/null
          app=$(ls dist/*.AppImage)
          "$app" --version
          "$app" info
          TERMITE_SELFTEST=3 xvfb-run -a "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: Termite-AppImage
          path: dist/*.AppImage

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(sed -n 's/^__version__ = "\(.*\)"/\1/p' termite/__init__.py)"
          fi
          gh release create "$tag" dist/*.AppImage --target "$GITHUB_SHA" --title "Termite ${tag#v}" --generate-notes
